
name: Nova Provider Adapter Test

on:
  push:
    paths:
      - 'provider-registry.js'
      - 'test-provider-registry.js'
      - 'provider-adapter.js'
      - 'test-provider-adapter.js'
      - '.github/workflows/provider-test.yml'
  workflow_dispatch:

jobs:
  test:
      - name: Test provider registry
        run: node test-provider-registry.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test provider adapter
        run: node test-provider-adapter.js
        
